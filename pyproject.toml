[project]
name = "commoditech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sastacat", email = "senpaigaming126@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-cors==4.0.1",
    "flask-sqlalchemy==3.1.1",
    "numpy>=1.26.4",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.1.1",
    "pyjwt>=2.7.0",
    "pytesseract==0.3.13",
    "pytest>=8.0.0",
    "python-dotenv==1.0.1",
    "rapidocr-onnxruntime>=1.4.4",
    "reportlab>=4.0.0",
    "requests>=2.34.2",
    "sqlalchemy==2.0.35",
    "werkzeug>=3.0.0",
]

[project.scripts]
commoditech = "commoditech:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
